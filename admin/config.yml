backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "works"
    label: "作品集"
    files:
      - name: "gallery"
        label: "作品列表"
        file: "content/works.json"
        fields:
          - { label: "作品", name: "items", widget: "list", fields: [
              { label: "標題", name: "title", widget: "string" },
              { label: "媒材 / 年份", name: "medium", widget: "string", required: false },
              { label: "圖片", name: "image", widget: "image", required: false },
              { label: "底色（沒有圖片時顯示）", name: "tint", widget: "color", required: false },
            ] }

  - name: "stickers"
    label: "貼圖"
    files:
      - name: "gallery"
        label: "貼圖列表"
        file: "content/stickers.json"
        fields:
          - { label: "貼圖", name: "items", widget: "list", fields: [
              { label: "名稱", name: "title", widget: "string" },
              { label: "圖片", name: "image", widget: "image", required: false },
              { label: "LINE 貼圖商店連結", name: "link", widget: "string" },
              { label: "價格（選填）", name: "price", widget: "string", required: false },
            ] }

  - name: "products"
    label: "產品"
    files:
      - name: "gallery"
        label: "產品列表"
        file: "content/products.json"
        fields:
          - { label: "產品", name: "items", widget: "list", fields: [
              { label: "名稱", name: "title", widget: "string" },
              { label: "圖片", name: "image", widget: "image", required: false },
              { label: "購買連結", name: "link", widget: "string", hint: "例如 LINE 貼圖商店、蝦皮、Etsy 的連結" },
              { label: "價格（選填）", name: "price", widget: "string", required: false },
            ] }

  - name: "settings"
    label: "網站設定"
    files:
      - name: "general"
        label: "一般設定"
        file: "content/settings.json"
        fields:
          - { label: "首頁標題", name: "heroTitle", widget: "string" }
          - { label: "首頁副標", name: "heroSub", widget: "string" }
          - { label: "關於我文字", name: "aboutText", widget: "text" }
          - { label: "聯絡信箱", name: "contactEmail", widget: "string" }
          - { label: "Instagram 連結", name: "instagramUrl", widget: "string", required: false }
          - { label: "Behance 連結", name: "behanceUrl", widget: "string", required: false }
